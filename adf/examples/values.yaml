configuration:
  # The URL at which the ADF application is accessible.
  # Where we ues the nip.io for convenience in combination with the most common docker gateway.
  externalUrl: http://poolparty.172.17.0.1.nip.io/ADF

  properties:
    # The public URL of the Keycloak instance.
    KEYCLOAK_PUBLIC_URL: http://keycloak.172.17.0.1.nip.io/auth

    # The internal URL of the Keycloak instance in the cluster.
    # Format: http://<service-name>.<namespace>:<port>/<context-path>
    KEYCLOAK_INTERNAL_URL: http://keycloak-service.keycloak:8080/auth

    # The URL of PoolParty. Note that this address should not contain the /PoolParty path.
    POOLPARTY_URL: http://poolparty.172.17.0.1.nip.io/

    # This is the client secret for the Keycloak client registration used by PoolParty for authentication.
    # A better place for this could be a secret, which is then added to the config, using extraEnvFrom.
    SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_PPT_CLIENTSECRET: "1-2-3-4-5-6-7-8-9-0"
